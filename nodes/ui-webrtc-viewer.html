<script type="text/javascript">
    RED.nodes.registerType('ui-webrtc-viewer', {
        category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
        color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
        defaults: {
            name: { value: "" },
            group: { type: 'ui-group', required: true },
            order: { value: 0 },
            url: { value: "" },
            streamName: { value: "" },
            reconnectInterval: {
              value: 5000,
              validate: function (v) {
                return !isNaN(v) && +v >= 0
              }
            },
            width: {
                value: 0,
                validate: function (v) {
                    const width = v || 0
                    const currentGroup = $('#node-input-group').val() || this.group
                    const groupNode = RED.nodes.node(currentGroup)
                    const valid = !groupNode || +width <= +groupNode.width
                    $('#node-input-size').toggleClass('input-error', !valid)
                    return valid
                }
            },
            height: { value: 0 }
        },
        inputs: 1,
        outputs: 1,
        icon: "file.svg",
        label: function() {
            return this.name || "ui-webrtc-viewer";
        },
        oneditprepare: function () {
            $('#node-input-size').elementSizer({
                width: '#node-input-width',
                height: '#node-input-height',
                group: '#node-input-group'
            });
        }
    });
</script>

<script type="text/html" data-template-name="ui-webrtc-viewer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-group"><i class="fa fa-table"></i> Group</label>
        <input type="text" id="node-input-group">
    </div>
    <div class="form-row">
        <label><i class="fa fa-object-group"></i> <span data-i18n="ui-webrtc-viewer.label.size"></label>
        <input type="hidden" id="node-input-width">
        <input type="hidden" id="node-input-height">
        <button class="editor-button" id="node-input-size"></button>
    </div>
    <div class="form-row">
        <label for="node-input-url"><i class="fa fa-link"></i> URL</label>
        <input type="text" id="node-input-url" placeholder="http://127.0.0.1/stream">
    </div>
    <div class="form-row">
        <label for="node-input-streamName">
            <i class="fa fa-video-camera"></i> Stream Name
        </label>
        <input
            type="text"
            id="node-input-streamName"
            placeholder="Stream 1">
    </div>
    <div class="form-row">
        <label for="node-input-reconnectInterval"><i class="fa fa-refresh"></i> Reconnect Interval</label>
        <input type="number" id="node-input-reconnectInterval" min="0" step="100" placeholder="5000">
        <span style="margin-left: 5px;">ms</span>
    </div>
</script>
